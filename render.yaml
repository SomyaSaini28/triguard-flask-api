services:
  - type: web
    name: triguard-planner
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TRIGUARD_ENV
        value: production
      - key: TRIGUARD_ALLOW_SELF_SIGNUP
        value: "false"
      - key: TRIGUARD_DATABASE_URL
        fromDatabase:
          name: triguard-postgres
          property: connectionString
      - key: TRIGUARD_SESSION_SECRET
        generateValue: true
      - key: TRIGUARD_API_KEY
        generateValue: true
      - key: TRIGUARD_ADMIN_EMAIL
        sync: false
      - key: TRIGUARD_ADMIN_PASSWORD
        sync: false

databases:
  - name: triguard-postgres
    region: singapore
    plan: free
