[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triguard"
version = "1.0.0"
description = "Calibrated disruption-risk triage for essential-medicine supply chains"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
    "Flask>=3.0,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "flask-cors>=4.0,<6",
    "gunicorn>=22,<24",
    "joblib>=1.3,<2",
    "pandas>=2.1,<3",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<2.5",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "shap>=0.45,<1",
]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.setuptools.packages.find]
include = ["api*", "triguard*"]
